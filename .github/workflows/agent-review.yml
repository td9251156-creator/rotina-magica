name: Agent Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  revisar:
    if: startsWith(github.head_ref, 'agent/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Conferir configuração
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY" || { echo 'Falta configurar o secret OPENAI_API_KEY.'; exit 1; }
      - name: Revisar pull request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx -y @openai/codex@0.163.0 exec review --ephemeral --ignore-user-config \
            --base origin/main --output-last-message "$RUNNER_TEMP/agent-review.md" - <<'PROMPT'
          Revise este PR como um revisor independente. Priorize bugs, perda ou exposição de dados, compatibilidade
          com registros antigos, funcionamento offline, acesso à Pausa agora, acessibilidade e testes ausentes.
          Verifique também promessas clínicas, ampliação indevida de escopo e mudanças em arquivos protegidos.
          Não altere arquivos. Liste achados por gravidade com arquivo e justificativa. Se não houver achados,
          diga isso explicitamente e mencione riscos que ainda dependem de teste humano.
          PROMPT
      - name: Publicar revisão sem aprovar
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/agent-review.md"

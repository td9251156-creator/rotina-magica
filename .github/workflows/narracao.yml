name: Narração

# Gera a narração das práticas com a voz do Azure e sobe num branch para revisão.
# Só roda à mão (Actions → Narração → Run workflow). A chave fica no secret AZURE_SPEECH_KEY,
# nunca no código nem no log; o Azure recebe só o texto do roteiro.
on:
  workflow_dispatch:
    inputs:
      voz:
        description: 'Voz do Azure (vazio = a mais natural da região)'
        required: false
        default: ''
      amostras:
        description: 'Só gerar amostras de todas as vozes (página amostras.html)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: brazilsouth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install soundfile numpy
      - name: Gerar
        env:
          VOZ: ${{ inputs.voz }}
          AMOSTRAS: ${{ inputs.amostras }}
        run: |
          test -n "$AZURE_SPEECH_KEY" || { echo "Falta o secret AZURE_SPEECH_KEY"; exit 1; }
          V=(); if [ -n "$VOZ" ]; then V=(--voice "$VOZ"); fi
          if [ "$AMOSTRAS" = "true" ]; then python scripts/gerar-narracao.py --engine azure --amostras | tee "$RUNNER_TEMP/gerar.log"; exit 0; fi
          npx vite-node scripts/narracao-textos.ts > "$RUNNER_TEMP/textos.json"
          python scripts/gerar-narracao.py --engine azure "${V[@]}" --extras "$RUNNER_TEMP/textos.json" | tee "$RUNNER_TEMP/gerar.log"
          npm test
      - name: Subir versão do cache
        if: ${{ !inputs.amostras }}
        run: python -c "import re,pathlib;p=pathlib.Path('public/sw.js');s=p.read_text();p.write_text(re.sub(r\"rumo-v(\d+)\",lambda m:f'rumo-v{int(m[1])+1}',s,1))"
      - name: Enviar para o branch narracao-azure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b narracao-azure
          git add public/audio public/sw.js
          git commit -m "gera a narração com a voz Azure" -m "$(grep -E '^(voz|estilo)' "$RUNNER_TEMP/gerar.log")"
          git push -f origin narracao-azure

name: Maintenance Report

on:
  schedule:
    - cron: '17 7 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: Mês opcional no formato YYYY-MM; vazio usa o mês anterior
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: maintenance-report
  cancel-in-progress: false

jobs:
  relatar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test .github/agents/maintenance-report.node-test.cjs
      - uses: actions/github-script@v8
        env:
          REPORT_MONTH: ${{ inputs.month }}
        with:
          script: |
            const report = require('./.github/agents/maintenance-report.cjs');
            await report({ github, context, core, month: process.env.REPORT_MONTH });

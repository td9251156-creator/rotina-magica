name: Ideia
description: Sugira um recurso ou melhoria
labels: [ideia]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que momento difícil isso ajudaria?
      description: "Ex.: corpo tenso, cabeça cheia, solidão, sobrecarga ou dificuldade para começar uma pausa."
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: A ideia
  - type: textarea
    id: evidencia
    attributes:
      label: Evidência (se souber)
      description: Fonte, experiência de uso ou observação que apoia a ideia, incluindo seus limites.

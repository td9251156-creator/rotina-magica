<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Rotina Mágica — Um novo começo, um dia de cada vez</title>
  <desc id="desc">Capa azul noturna e dourada com o nome do app e um caminho em direção ao sol.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#1b2941"/><stop offset="1" stop-color="#0e1017"/></linearGradient>
    <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#fff0c4"/><stop offset="1" stop-color="#c9a45c"/></linearGradient>
    <clipPath id="art"><rect x="690" y="40" width="470" height="550" rx="160"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="#0e1017"/>
  <rect x="24" y="24" width="1152" height="582" rx="30" fill="none" stroke="#c9a45c" stroke-opacity=".28"/>
  <g clip-path="url(#art)">
    <rect x="690" y="40" width="470" height="550" fill="url(#sky)"/>
    <circle cx="925" cy="285" r="112" fill="url(#gold)"/>
    <path d="M650 310Q770 245 925 295T1210 275V630H650Z" fill="#27364e"/>
    <path d="M650 375Q820 315 925 305T1210 360V630H650Z" fill="#101823"/>

    <path d="M1050 103Q1053 130 1080 133Q1053 136 1050 163Q1047 136 1020 133Q1047 130 1050 103Z" fill="#efd497"/>
  </g>
  <text x="76" y="118" fill="#d6b779" font-family="DejaVu Sans, sans-serif" font-size="19" letter-spacing="4">ROTINA MÁGICA</text>
  <path d="M76 150h64" stroke="#c9a45c" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f1e6cf" font-family="DejaVu Serif, serif" font-size="56">
    <text x="72" y="255">Um novo começo,</text>
    <text x="72" y="337">um dia de cada vez.</text>
  </g>
  <text x="76" y="414" fill="#d4cbb9" font-family="DejaVu Sans, sans-serif" font-size="23">Pequenos passos. No seu tempo.</text>
